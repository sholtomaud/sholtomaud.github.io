name: Update Patch Dependencies

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-patches:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.62.1-noble

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js v25
        uses: actions/setup-node@v4
        with:
          node-version: 25.x
          cache: 'npm'

      - name: Update patch dependencies and devDependencies
        run: |
          npx npm-check-updates --target patch -u
          npm update

      - name: Typecheck (tsgo)
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit Tests
        run: npm test

      - name: E2E Tests
        run: npx playwright test

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH_NAME="automation/patch-dependencies"
          git checkout -B "$BRANCH_NAME"
          git add -A
          git commit -m "chore(deps): update npm patch dependencies"
          git push origin "$BRANCH_NAME" --force

          BODY="Automated patch dependency update.

          All checks (typecheck, build, unit tests, e2e tests) have passed."

          if gh pr view "$BRANCH_NAME" >/dev/null 2>&1; then
            gh pr edit "$BRANCH_NAME" \
              --title "chore(deps): update npm patch dependencies" \
              --body "$BODY"
          else
            gh pr create \
              --title "chore(deps): update npm patch dependencies" \
              --body "$BODY" \
              --head "$BRANCH_NAME" \
              --base "main" \
              --label "dependencies" \
              --label "automated"
          fi
