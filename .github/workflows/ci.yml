name: CI Pipeline

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  playwright-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read Playwright version
        id: read-version
        run: echo "version=$(cat .playwright-version)" >> "$GITHUB_OUTPUT"

  test:
    needs: playwright-version
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js v25
        uses: actions/setup-node@v4
        with:
          node-version: 25.x
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Typecheck (tsgo)
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit Tests
        run: npm test

      - name: E2E Tests
        run: npx playwright test
